services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-locally}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-athena123}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports: ["5000:5000"]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
